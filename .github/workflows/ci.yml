name: EBOOK_ONLINE Automated CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Asset Directories & Initial Seed
        run: node scripts/generate_assets.js

      - name: Run Automated Test Suite (10 Test Cases)
        run: |
          node server.js &
          SERVER_PID=$!
          echo "Waiting for server to start..."
          node -e "
          const http = require('http');
          let retries = 0;
          function check() {
            http.get('http://127.0.0.1:3000/api/ebooks', res => {
              console.log('Server is UP with status:', res.statusCode);
              process.exit(0);
            }).on('error', () => {
              if (++retries > 30) {
                console.error('Server failed to respond within 15s');
                process.exit(1);
              }
              setTimeout(check, 500);
            });
          }
          check();
          "
          node tests/run_tests.js
          kill $SERVER_PID || true


