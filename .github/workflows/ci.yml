name: EBOOK_ONLINE Automated CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Asset Directories & Initial Seed
        run: node scripts/generate_assets.js

      - name: Run Automated Test Suite (10 Test Cases)
        run: |
          node server.js > server.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          echo "=== Server Output ==="
          cat server.log
          echo "=== Running Tests ==="
          node tests/run_tests.js
          kill $SERVER_PID || true

      - name: Upload Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: server.log




